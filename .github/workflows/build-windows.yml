# Builds ForeverAICompanion.exe on a Windows machine, after running every test
# there (the Windows-only ones included), runs the built exe like a player
# would (scripts/smoke-windows.mjs), and attaches it to a release.
#
# Run it from Actions › "Windows build" › Run workflow, with the release's tag
# (for example v1.11.0; a draft release works). Without a tag the exe is only
# kept as a download of the run.
name: Windows build

on:
  workflow_dispatch:
    inputs:
      release:
        description: Tag of the release to attach the exe to (empty = only keep it as an artifact)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      # The files as they are in the repository (no Windows line endings), like a local build.
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v4

      # --build-sea (scripts/build.js) needs Node.js 25.5 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Runs the built exe like a player: install, addon, invisible voice end to
      # end, update, uninstall (scripts/smoke-windows.mjs). A failing exe is
      # never attached to the release.
      - name: Smoke test of the exe
        run: node scripts/smoke-windows.mjs dist/ForeverAICompanion.exe smoke-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: companion/smoke-out
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ForeverAICompanion.exe
          path: companion/dist/ForeverAICompanion.exe
          if-no-files-found: error

      - name: Attach to the release
        if: inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: gh release upload "$RELEASE" dist/ForeverAICompanion.exe --clobber --repo "$GITHUB_REPOSITORY"
