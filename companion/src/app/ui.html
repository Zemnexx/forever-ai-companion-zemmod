<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever AI Companion</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
  :root {
    --bg: #0e1014;
    --surface: #161a21;
    --surface-2: #1d222b;
    --surface-3: #252b36;
    --line: #2a303b;
    --line-2: #363d4a;
    --text: #eef1f6;
    --muted: #a3abb9;
    --faint: #737c8c;
    --accent: #5b8cff;
    --accent-2: #3f6fe6;
    --accent-soft: rgba(91, 140, 255, .14);
    --ok: #3ccf7a;
    --ok-soft: rgba(60, 207, 122, .13);
    --warn: #f5b43c;
    --warn-soft: rgba(245, 180, 60, .13);
    --bad: #f26b5b;
    --bad-soft: rgba(242, 107, 91, .13);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  a { color: var(--accent); }
  code, kbd { font-family: Consolas, monospace; font-size: 13px; background: var(--surface-3); border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 7px; }
  kbd { border-bottom-width: 2px; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .small { font-size: 13px; }
  h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }

  /* Top bar ----------------------------------------------------------------- */
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: #0b0d11; height: 63px; }
  .logo { width: 36px; height: 36px; flex: none; }
  .logo svg { width: 20px; height: 20px; }
  .top .name { font-weight: 650; font-size: 16px; }
  .top .ver { color: var(--faint); font-size: 12.5px; margin-left: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chip.ok { color: var(--ok); background: var(--ok-soft); }
  .chip.warn { color: var(--warn); background: var(--warn-soft); }
  .chip.bad { color: var(--bad); background: var(--bad-soft); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .top .chip { margin-left: auto; }

  /* Wizard layout --------------------------------------------------------- */
  .wizard { display: grid; grid-template-columns: 250px 1fr; height: calc(100% - 63px); }
  .steps { padding: 24px 16px; border-right: 1px solid var(--line); overflow-y: auto; }
  .steps ol { list-style: none; margin: 0; padding: 0; }
  .steps li { position: relative; }
  .steps li:not(:last-child)::after { content: ""; position: absolute; left: 21px; top: 42px; bottom: -6px; width: 2px; background: var(--line); }
  .steps li.done:not(:last-child)::after { background: var(--ok); opacity: .5; }
  .steps button {
    width: 100%; display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 8px 8px 14px; border-radius: 10px;
    background: none; border: none; color: var(--muted); font: inherit; cursor: pointer;
  }
  .steps button:disabled { cursor: default; }
  .steps button:not(:disabled):hover { background: var(--surface); }
  .steps .num {
    width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px;
    border: 2px solid var(--line-2); color: var(--faint); background: var(--bg); position: relative; z-index: 1;
  }
  .steps li.done .num { background: var(--ok); border-color: var(--ok); color: #06210f; }
  .steps li.current .num { border-color: var(--accent); color: #fff; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .steps b { display: block; font-weight: 600; color: var(--text); font-size: 14.5px; line-height: 1.3; margin-top: 3px; }
  .steps li:not(.done):not(.current) b { color: var(--muted); }
  .steps small { display: block; font-size: 12.5px; color: var(--faint); line-height: 1.35; margin-top: 2px; }
  .steps .opt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin-left: 6px; font-weight: 600; }

  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .page { flex: 1; overflow-y: auto; padding: 32px 40px 28px; }
  .page-inner { max-width: 680px; }
  .kicker { color: var(--accent); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .page h1 { font-size: 26px; line-height: 1.25; }
  .lead { color: var(--muted); font-size: 16px; margin: 8px 0 22px; }
  .footer { display: flex; align-items: center; gap: 10px; padding: 14px 40px; border-top: 1px solid var(--line); background: #0b0d11; }
  .footer .hint { color: var(--faint); font-size: 13px; margin-right: auto; }

  /* Buttons ----------------------------------------------------------------- */
  .btn {
    font: inherit; font-weight: 600; font-size: 14.5px; padding: 9px 18px; border-radius: 9px; cursor: pointer;
    background: var(--surface-3); color: var(--text); border: 1px solid var(--line-2); transition: background .12s, border-color .12s;
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: #4a5262; background: #2b3240; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
  .btn.ghost { background: none; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover:not(:disabled) { color: var(--text); background: var(--surface-2); border-color: transparent; }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 6px 12px; font-size: 13.5px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:focus-visible, .switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
  .spin { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Content blocks ------------------------------------------------------------ */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
  .card h3 { font-size: 16px; margin-bottom: 4px; }
  .callout { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: var(--radius); margin-bottom: 14px; border: 1px solid; }
  .callout .ic { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; }
  .callout .ic svg { width: 17px; height: 17px; }
  .callout > div > b { display: block; font-size: 15.5px; margin-bottom: 2px; }
  .callout p { margin: 0; color: var(--muted); }
  .callout > div { min-width: 0; flex: 1; }
  .callout.ok { background: var(--ok-soft); border-color: rgba(60,207,122,.35); } .callout.ok .ic { background: var(--ok); }
  .callout.warn { background: var(--warn-soft); border-color: rgba(245,180,60,.35); } .callout.warn .ic { background: var(--warn); }
  .callout.bad { background: var(--bad-soft); border-color: rgba(242,107,91,.35); } .callout.bad .ic { background: var(--bad); }
  .callout.info { background: var(--accent-soft); border-color: rgba(91,140,255,.35); } .callout.info .ic { background: var(--accent); }
  .path { font-family: Consolas, monospace; font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; margin-top: 10px; word-break: break-all; color: var(--text); }
  .features { display: grid; gap: 14px; margin: 4px 0 22px; }
  .feature { display: flex; gap: 14px; align-items: flex-start; }
  .feature .ic { width: 40px; height: 40px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--accent-soft); }
  .feature .ic svg { width: 20px; height: 20px; }
  .feature div > b { display: block; }
  .feature span { color: var(--muted); font-size: 14px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; }
  .fact { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }

  /* Choices (radio cards) ----------------------------------------------------- */
  .choices { display: grid; gap: 10px; }
  .choice {
    display: grid; grid-template-columns: 22px 1fr; gap: 14px; align-items: flex-start; padding: 15px 18px; border-radius: var(--radius); cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); transition: border-color .12s, background .12s;
  }
  .choice:hover { border-color: #46505f; }
  .choice.sel { border-color: var(--accent); background: linear-gradient(0deg, var(--accent-soft), var(--accent-soft)), var(--surface); }
  .choice:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .choice input { appearance: none; width: 20px; height: 20px; margin: 2px 0 0; border-radius: 50%; border: 2px solid var(--line-2); background: var(--bg); cursor: pointer; }
  .choice input:checked { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 5px, var(--bg) 6px); }
  .choice input:focus { outline: none; }
  .choice .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .choice .title { font-weight: 650; font-size: 15.5px; }
  .choice .desc { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .badge { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .badge.rec { color: #fff; background: var(--accent); }
  .badge.using { color: var(--ok); background: var(--ok-soft); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 12.5px; padding: 2px 9px; border-radius: 6px; background: var(--surface-3); color: var(--muted); }
  .tag.good { color: var(--ok); background: var(--ok-soft); }
  .tag.cost { color: var(--warn); background: var(--warn-soft); }
  details.more { margin-top: 10px; }
  .explain { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13.5px; }
  .explain dt { color: var(--text); font-weight: 600; }
  .explain dd { margin: 0; color: var(--muted); }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 16px; font-size: 13px; }
  .flow span { padding: 5px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .flow span.hi { color: #fff; background: var(--accent-soft); border-color: rgba(91,140,255,.5); }
  .flow i { color: var(--faint); font-style: normal; }
  details.more summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 4px 0; }

  /* Setup checklist inside the AI step --------------------------------------- */
  .todo { list-style: none; margin: 8px 0 0; padding: 0; }
  .todo > li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
  .todo > li:first-child { border-top: none; padding-top: 4px; }
  .todo .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--surface-3); color: var(--muted); }
  .todo .n.ok { background: var(--ok); color: #06210f; }
  .todo li > div > b { display: block; }
  .todo p, .todo ol { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .todo ol { padding-left: 18px; }
  .todo .act { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .todo .act > input, .todo .act > .models { flex: 1 1 100%; }
  input[type=text], input[type=password] {
    width: 100%; font: inherit; padding: 10px 12px; border-radius: 9px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line-2);
  }
  input[type=text]:focus, input[type=password]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .models { display: grid; gap: 8px; }
  .models .choice { padding: 11px 14px; }
  .result { margin-top: 14px; }
  .answer { white-space: pre-wrap; margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: rgba(0,0,0,.25); color: var(--text); font-size: 14px; }

  /* Switch ------------------------------------------------------------------- */
  .switch { position: relative; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line-2); cursor: pointer; transition: .2s; }
  .switch i::before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; border-radius: 50%; background: var(--muted); transition: .2s; }
  .switch input:checked + i { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + i::before { transform: translateX(20px); background: #fff; }
  .select { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 9px; background: var(--surface-3); color: var(--text); border: 1px solid var(--line-2); cursor: pointer; }
  .select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .line { display: flex; align-items: center; gap: 14px; }
  .line .t { flex: 1; min-width: 0; }
  .line .t p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  /* Done step ------------------------------------------------------------------- */
  .big-check { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); margin-bottom: 16px; box-shadow: 0 0 0 8px var(--ok-soft); }
  .big-check svg { width: 32px; height: 32px; }
  .howto { counter-reset: h; list-style: none; padding: 0; margin: 0; }
  .howto li { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 10px 0; }
  .howto li::before { counter-increment: h; content: counter(h); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
  .howto li > div > b { display: block; }
  .howto span { color: var(--muted); font-size: 14px; }

  /* Dashboard -------------------------------------------------------------------- */
  .dash { height: calc(100% - 63px); overflow-y: auto; }
  .dash-inner { max-width: 860px; margin: 0 auto; padding: 28px 28px 40px; }
  .rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 22px; }
  .rowi { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-top: 1px solid var(--line); }
  .rowi:first-child { border-top: none; }
  .rowi .ic { width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--surface-3); }
  .rowi .ic svg { width: 19px; height: 19px; }
  .rowi .t { flex: 1; min-width: 0; }
  .rowi .t > b { display: block; font-weight: 600; }
  .rowi .t span { color: var(--muted); font-size: 13.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .section-title { font-size: 12.5px; font-weight: 650; color: var(--faint); text-transform: uppercase; letter-spacing: .07em; margin: 0 0 8px 4px; }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { padding: 14px 18px; border-top: 1px solid var(--line); }
  .feed li:first-child { border-top: none; }
  .feed .meta { font-size: 12.5px; color: var(--faint); }
  .feed .q { font-weight: 600; margin: 2px 0 6px; }
  .feed .a { color: var(--muted); white-space: pre-wrap; font-size: 14px; }
  .feed .a.bad { color: var(--bad); }
  .feed .a.wait { display: flex; align-items: center; gap: 8px; }
  .feed .a.wait .spin { border-color: rgba(91,140,255,.3); border-top-color: var(--accent); }
  .empty { text-align: center; padding: 26px 16px; color: var(--muted); }

  /* Toasts and dialogs --------------------------------------------------------- */
  #toasts { position: fixed; right: 20px; bottom: 84px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: min(380px, calc(100vw - 40px)); }
  .toast { background: var(--surface-3); border: 1px solid var(--line-2); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: rise .2s ease-out; font-size: 14px; }
  .toast.ok { border-left-color: var(--ok); } .toast.bad { border-left-color: var(--bad); }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } }
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 60; padding: 16px; }
  .modal { width: min(440px, 100%); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 14px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .modal h3 { font-size: 18px; margin-bottom: 6px; }
  .modal p { color: var(--muted); margin: 0; }
  .modal .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  @media (max-width: 780px) {
    .wizard { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .steps { border-right: none; border-bottom: 1px solid var(--line); padding: 10px 12px; }
    .steps ol { display: flex; gap: 4px; overflow-x: auto; }
    .steps li::after { display: none !important; }
    .steps button { padding: 6px; align-items: center; }
    .steps button div { display: none; }
    .steps li.current button div { display: block; }
    .steps li.current b { margin-top: 0; }
    .steps small { display: none; }
    .page { padding: 22px 18px; }
    .footer { padding: 12px 18px; }
    .footer .hint { display: none; }
    .top { padding: 12px 16px; }
    .top .ver { display: none; }
    .dash-inner { padding: 20px 16px 32px; }
    .explain { grid-template-columns: 1fr; gap: 2px; }
    .explain dd { margin-bottom: 8px; }
  }
</style>
</head>
<body>
<header class="top">
  <img class="logo" src="/icon.png" alt="">
  <div><span class="name">Forever AI Companion</span><span class="ver" id="version"></span></div>
  <span class="chip hidden" id="chip"><span class="dot"></span><span id="chip-text"></span></span>
</header>

<!-- Setup wizard ---------------------------------------------------------------->
<div class="wizard hidden" id="wizard">
  <nav class="steps" aria-label="Setup steps"><ol id="stepper"></ol></nav>
  <div class="pane">
    <main class="page" id="page"><div class="page-inner" id="page-inner"></div></main>
    <div class="footer">
      <span class="hint" id="footer-hint"></span>
      <button class="btn ghost" id="btn-back">Back</button>
      <button class="btn primary" id="btn-next">Next</button>
    </div>
  </div>
</div>

<!-- Dashboard (after setup) ---------------------------------------------------->
<div class="dash hidden" id="dash"><div class="dash-inner" id="dash-inner"></div></div>

<div id="toasts"></div>

const LANGS = Object.keys(I18N);
let lang = String(navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en';

// t('ai.setup', { name }) -> "Set up: …". Values are inserted as given (escape them first when needed).
function t(key, vars) {
  let s = I18N[lang]?.[key];
  if (s === undefined) s = I18N.en[key];
  if (s === undefined) return key;
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m)) : s;
}

const PAGE_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);

async function api(path, body) {
  const opts = body === undefined && path === 'status'
    ? {}
    : { method: 'POST', headers: { 'content-type': 'application/json', 'x-forever-ai-companion': '1' }, body: JSON.stringify(body || {}) };
  const res = await fetch(path === 'status' ? `/api/status?page=${PAGE_ID}` : `/api/${path}`, opts);
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `Error ${res.status}`);
  return json;
}

function toast(kind, html, ms = 5000) {
  const el = document.createElement('div');
  el.className = `toast ${kind || ''}`;
  el.innerHTML = html;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

function confirmBox(title, text, okLabel, danger) {
  return new Promise((resolve) => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${title}</h3><p>${text}</p>
      <div class="acts"><button class="btn ghost" data-a="no">${t('btn.cancel')}</button><button class="btn ${danger ? 'danger' : 'primary'}" data-a="yes">${okLabel}</button></div></div>`;
    const onKey = (e) => { if (e.key === 'Escape') done(false); };
    const done = (v) => { document.removeEventListener('keydown', onKey); back.remove(); resolve(v); };
    document.addEventListener('keydown', onKey);
    back.onclick = (e) => { if (e.target === back) done(false); };
    back.querySelector('[data-a=no]').onclick = () => done(false);
    back.querySelector('[data-a=yes]').onclick = () => done(true);
    document.body.appendChild(back);
    back.querySelector('[data-a=yes]').focus();
  });
}

const callout = (kind, title, text) => {
  const ic = { ok: ICON.check, warn: ICON.alert, bad: ICON.x, info: ICON.info }[kind];
  return `<div class="callout ${kind}"><span class="ic">${ic}</span><div><b>${title}</b>${text ? `<p>${text}</p>` : ''}</div></div>`;
};

// Rendering
// ---------------------------------------------------------------------------
let currentView = null;
function renderWizard(full = true) {
  const steps = visibleSteps();
  const idx = steps.findIndex((s) => s.id === step);
  // Steps can be visited up to the first one not done yet.
  const firstOpen = steps.findIndex((s) => s.id !== 'welcome' && s.id !== 'voice' && !isDone[s.id]());
  $('stepper').innerHTML = steps.map((s, i) => {
    const doneStep = isDone[s.id]() && s.id !== 'welcome' && i !== idx;
    const reachable = !returnToDash && (firstOpen === -1 || i <= firstOpen);
    return `<li class="${i === idx ? 'current' : doneStep ? 'done' : ''}"><button data-step="${s.id}" ${reachable && i !== idx ? '' : 'disabled'}>
      <span class="num">${doneStep ? '✓' : i + 1}</span><div><b>${s.title}${s.optional ? `<span class="opt">${t('step.optional')}</span>` : ''}</b><small>${s.sub}</small></div></button></li>`;
  }).join('');
  document.querySelectorAll('#stepper button').forEach((b) => { b.onclick = () => go(b.dataset.step); });

  currentView = VIEWS[step]();
  if (full) {
    const focusId = document.activeElement?.id;
    const keyVal = $('key')?.value;
    $('page-inner').innerHTML = currentView.html;
    if (keyVal && $('key')) $('key').value = keyVal;
    if (focusId && $(focusId)) $(focusId).focus();
    document.querySelectorAll('#page [data-act]').forEach((b) => { b.onclick = () => ACTIONS[b.dataset.act](); });
    currentView.after?.();
  }
  const n = currentView.next;
  $('btn-back').classList.toggle('hidden', idx === 0 && !returnToDash);
  $('btn-back').textContent = returnToDash ? t('btn.cancel') : t('btn.back');
  $('btn-next').innerHTML = n.label;
  $('btn-next').disabled = Boolean(n.disabled);
  $('footer-hint').textContent = currentView.hint || t('footer.stepOf', { n: idx + 1, total: steps.length });
}

$('btn-next').onclick = () => currentView?.next.action?.();
$('btn-back').onclick = () => {
  if (returnToDash) return openDash();
  const steps = visibleSteps();
  const idx = steps.findIndex((s) => s.id === step);
  if (idx > 0) go(steps[idx - 1].id);
};

function go(id) {
  step = id;
  const choice = aiChoice || status?.ai.preset || 'claude-code';
  if (id === 'ai' && CLI[choice]) checkCli(choice);
  $('page').scrollTo(0, 0);
  render();
}

function openWizard(id, fromDash = false) {
  mode = 'wizard';
  returnToDash = fromDash;
  if (id === 'talk') { talkDraft = null; talkResult = null; }
  aiChoice = null; aiModel = null; aiTest = null;
  voiceChoice = null; voiceMsg = null; addonJustInstalled = null;
  go(id);
}

function openDash() {
  mode = 'dash';
  returnToDash = false;
  render();
}

function render() {
  if (!status) return;
  $('wizard').classList.toggle('hidden', mode !== 'wizard');
  $('dash').classList.toggle('hidden', mode !== 'dash');
  const ok = setupComplete() && status.running;
  $('chip').className = `chip ${ok ? 'ok' : 'warn'}${mode === 'dash' ? '' : ' hidden'}`;
  $('chip-text').textContent = ok ? t('chip.ok') : t('chip.warn');
  $('version').textContent = `v${status.version}`;
  if (mode === 'wizard') { renderWizard(); lastWizardKey = wizardKey(); }
  else renderDash();
}

// Dashboard ------------------------------------------------------------------
function ago(iso) {
  const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
  if (s < 60) return t('ago.now');
  if (s < 3600) return t('ago.min', { n: Math.round(s / 60) });
  return new Date(iso).toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit' });
}
function modelLabel(id) {
  const p = ALL[id];
  const m = status.ai.models[id] || status.ai.defaults[id];
  return p?.models?.find(([v]) => v === m)?.[1] || m || '';
}

// "Reviewed on November 13, 2026 · updates itself from the internet"
function guideText(g) {
  const [y, m, d] = g.date.split('-').map(Number);
  const date = new Date(y, m - 1, d).toLocaleDateString(lang, { day: 'numeric', month: 'long', year: 'numeric' });
  const how = g.autoUpdate ? t('guide.auto') : t('guide.bundled');
  const old = g.stale ? ` · <span style="color:var(--warn)">${t('guide.old', { n: g.age })}</span>` : '';
  return t('guide.text', { date: esc(date), how, old });
}

async function installAddon() {

}

async function saveAndTest() {
  await run('save', async () => {
    const p = ALL[aiChoice];
    const model = p.models ? document.querySelector('input[name=model]:checked')?.value
      : p.modelText ? $('model-text')?.value : undefined;
    try {
      await api('set-ai', { preset: aiChoice, apiKey: $('key')?.value || '', model });
    } catch (e) {
      aiTest = { state: 'bad', html: callout('bad', t('ai.saveFail'), esc(e.message)) };
      return;
    }
    aiTest = { state: 'running', html: callout('info', t('ai.testing'), t('ai.testingText')) };
    status = await api('status');
    render();
    $('ai-result')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    try {
      const r = await api('test-ai');
      aiTest = { state: 'ok', html: `<div class="callout ok"><span class="ic">${ICON.check}</span><div><b>${t('ai.works')}</b><p>${t('ai.answered', { model: esc(r.model), s: r.seconds })}</p><div class="answer">${esc(r.text)}</div></div></div>` };
    } catch (e) {
      aiTest = { state: 'bad', html: callout('bad', t('ai.testFail'), `${esc(e.message)}<br>${t('ai.testFailText')}`) };
    }
  });
  $('ai-result')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

    } catch (e) {
      voiceMsg = callout('bad', t('voice.onFail'), `${esc(e.message)}. ${t('voice.onFailText')}`);
    }
    await checkVoice();
  });
}

async function deactivateVoice() {
  await run('voice', async () => {
    await api('voice-uninstall');
    voiceMsg = callout('ok', t('voice.offOk'), t('voice.offOkText'));
    await checkVoice();
  });
}

// Voice questions: what the screen shows, saved together.
function talkPatch() {
  const key = $('key')?.value?.trim();
  return {
    enabled: talkDraft?.enabled ?? talkInfo?.enabled ?? false,
    model: talkDraft?.model || talkInfo?.model,
    ...(key ? { apiKey: key } : {}),
  };
}
function saveTalk() {
  return run('talk-save', async () => {
    const wasOn = Boolean(talkInfo?.enabled);
    talkInfo = await api('set-talk', talkPatch());
    talkDraft = null; talkResult = null;
    if (talkInfo.enabled !== wasOn) toast('ok', talkInfo.enabled ? t('toast.talkOn') : t('toast.talkOff'));
    openDash();
  });
}

const ACTIONS = {
  talkTest: () => run('talkTest', async () => {
    talkResult = null;
    try {
      // The key just typed is saved first, so the test uses it (on/off stays as saved).
      const key = $('key')?.value?.trim();
      if (key) { talkInfo = await api('set-talk', { apiKey: key, model: talkPatch().model }); $('key').value = ''; }
      const r = await api('talk-test');
      talkResult = callout('ok', t('talk.testOk', { text: esc(r.text), s: esc(r.seconds) }), '');
    } catch (e) {
      talkResult = callout('bad', t('talk.testFail'), esc(e.message));
    }
  }),
  detect: () => run('detect', async () => {
    const r = await api('detect-wow');
    if (!r.found.length) toast('bad', t('game.detectFail'));
  }),
  pick: () => run('pick', async () => { await api('pick-wow'); }),
  install: installAddon,
  'cli-install': async () => {
    const id = aiChoice;
    try {
      const r = await api(`${CLI[id].api}-install`);
      // Codex: installed by the app (progress comes with the status); Claude Code: a console window.
      if (id !== 'codex') cli[id] = { ...(cli[id] || {}), waiting: true };
      if (r.already) toast('ok', t('ai.cliInstalled'));
      await checkCli(id);
    } catch (e) { toast('bad', esc(e.message)); }
  },
  'cli-search': async () => {
    try { await api('codex-search'); await checkCli('codex'); } catch (e) { toast('bad', esc(e.message)); }
  },
  'cli-pick': () => run('cli-pick', async () => {
    const r = await api('codex-pick');
    if (!r.cancelled) await checkCli('codex');
  }),
  'cli-login': async () => {
    const id = aiChoice;
    try { await api(`${CLI[id].api}-login`); cli[id] = { ...(cli[id] || {}), waiting: true }; render(); } catch (e) { toast('bad', esc(e.message)); }
  },
  knowledge: () => api('knowledge').catch((e) => toast('bad', esc(e.message))),
  updateCheck: () => run('updateCheck', async () => {
    const r = await api('update-check');
    toast('ok', ['available', 'ready'].includes(r.status) ? t('toast.updAvailable', { v: esc(r.latest) }) : r.status === 'latest' ? t('toast.updLatest') : esc(r.error || t('upd.error')));
  }),
  update: () => run('update', async () => {
    const before = status.version;
    await api('update-install');
    // The new version closes this one and starts again: wait for it, then reload.
    endScreen(t('upd.restartTitle'), t('upd.restartText'));
    const started = Date.now();
    const poll = async () => {
      try {
        const s = await (await fetch('/api/status')).json();
        if (s.version && s.version !== before) return location.reload();
      } catch { /* restarting */ }
      if (Date.now() - started > 90000) document.querySelector('p').textContent = t('upd.slowText');
      setTimeout(poll, 1500);
    };
    setTimeout(poll, 3000);
  }),
  guide: () => run('guide', async () => {
    const r = await api('guide-check');
    toast('ok', r.updated ? t('toast.guideUpdated') : t('toast.guideLatest'));
  }),
  wizard: () => openWizard('welcome'),
  quit: async () => {
    if (!(await confirmBox(t('quit.title'), t('quit.text'), t('dash.quit')))) return;
    await api('quit').catch(() => {});
    endScreen(t('quit.endTitle'), t('quit.endText'));
  },
  uninstall: async () => {
    if (!(await confirmBox(t('uninstall.title'), t('uninstall.text'), t('dash.uninstall'), true))) return;
    await api('uninstall').catch(() => {});
    endScreen(t('uninstall.endTitle'), t('uninstall.endText'));
  },
};

function endScreen(title, text) {
  stopped = true;
  document.body.innerHTML = `<div style="height:100%;display:grid;place-items:center;text-align:center;padding:24px">
    <div><h1 style="font-size:24px;margin-bottom:8px">${title}</h1><p style="color:var(--muted)">${text}</p></div></div>`;
}

// ---------------------------------------------------------------------------
// Data refresh
// ---------------------------------------------------------------------------
let stopped = false;
async function checkCli(id) {
  let next;
  try {
    next = await api(`${CLI[id].api}-status`);
    if (cli[id]?.waiting && !(next.installed && next.loggedIn)) next.waiting = true;
  } catch { next = { installed: false, loggedIn: false }; }
  cli[id] = next;
  // Codex not in the usual places: search the PC once, without being asked.
  if (id === 'codex' && !next.installed && next.search?.status === 'idle' && !codexAutoSearched) {
    codexAutoSearched = true;
    api('codex-search').then(() => checkCli('codex')).catch(() => {});
  }
  if (mode === 'wizard' && step === 'ai') render();
}
let codexAutoSearched = false;
setInterval(() => {
  if (!stopped && mode === 'wizard' && step === 'ai' && CLI[aiChoice] && !(cli[aiChoice]?.installed && cli[aiChoice]?.loggedIn)) checkCli(aiChoice);
}, 3000);

async function checkVoice() {
  try { voice = await api('voice-status'); } catch { voice = { supported: false, active: false }; }
  try { talkInfo = await api('talk-status'); } catch { talkInfo = null; }
}

// Polls the app every 2 s. The wizard is only redrawn when something it shows
// changed (new questions alone don't redraw it, so typing is never disturbed).
let lastWizardKey = '';
const wizardKey = () => JSON.stringify([{ ...status, events: null }, voice, talkInfo, talkResult, cli, busyAction, step, aiChoice, aiTest?.state, voiceChoice, lang]);
async function refresh(force = false) {
  if (stopped) return;
  try {
    status = await api('status');
  } catch {
    $('chip').className = 'chip bad';
    $('chip-text').textContent = t('chip.down');
    return;
  }
  // The app says which language to use (when it knows); a change redraws everything.
  if (LANGS.includes(status.lang) && status.lang !== lang) setLang(status.lang);
  if (!mode) {
    mode = setupComplete() ? 'dash' : 'wizard';
    if (mode === 'wizard') {
      // Start at the first step that is not done (or the welcome on a fresh install).
      const first = visibleSteps().find((s) => !['welcome', 'voice', 'done'].includes(s.id) && !isDone[s.id]());
      step = isDone.game() ? first.id : 'welcome';
      if (step === 'ai') checkCli(CLI[status.ai.preset] ? status.ai.preset : 'claude-code');
    }
  }
  if (mode === 'wizard' && !force && wizardKey() === lastWizardKey) return;
  render();
}

// Closing the window: the app decides (ask / keep running / quit). A reload
// sends this too, but the app waits and sees the page come back.
window.addEventListener('pagehide', () => {
  if (stopped) return;
  try { fetch('/api/window-closed', { method: 'POST', keepalive: true, headers: { 'content-type': 'application/json', 'x-forever-ai-companion': '1' }, body: JSON.stringify({ page: PAGE_ID }) }); } catch { /* closing */ }
});

(async () => {
  await checkVoice();
  await refresh();
  setInterval(refresh, 2000);
  setInterval(checkVoice, 15000);
})();
</script>
</body>
